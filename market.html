<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>929</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --bg2: #0f0f0f;
    --bg3: #141414;
    --card: #111111;
    --red: #e01c1c;
    --red2: #ff2929;
    --red-dim: #6e0a0a;
    --border: #1e1e1e;
    --border-red: #3a0000;
    --text: #e8e8e8;
    --muted: #555;
    --white: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    cursor: crosshair;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  header {
    border-bottom: 1px solid var(--border-red);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    background: rgba(8,8,8,0.96);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo span { color: var(--red); }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,28,28,0.6); }
    50%       { box-shadow: 0 0 0 6px rgba(224,28,28,0); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--red);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .toolbar {
    max-width: 1100px;
    margin: 0 auto 40px;
    padding: 40px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .search-wrap { position: relative; }

  .search-wrap svg {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 14px 20px 14px 50px;
    outline: none;
    letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput::placeholder { color: var(--muted); }

  #searchInput:focus {
    border-color: var(--red-dim);
    box-shadow: 0 0 0 3px rgba(224,28,28,0.08), inset 0 0 20px rgba(224,28,28,0.03);
  }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-right: 4px;
    text-transform: uppercase;
  }

  .filter-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 1.5px;
    padding: 8px 20px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .filter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--red);
    transform: translateX(-100%);
    transition: transform 0.25s;
    z-index: 0;
  }

  .filter-btn > * { position: relative; z-index: 1; }

  .filter-btn:hover::before,
  .filter-btn.active::before { transform: translateX(0); }

  .filter-btn:hover,
  .filter-btn.active { color: var(--white); border-color: var(--red); }

  .filter-icon { width: 16px; height: 16px; }

  .stats-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .count-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    background: var(--red-dim);
    color: var(--red2);
    padding: 2px 8px;
    letter-spacing: 1px;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    text-decoration: none;
    display: block;
    animation: fadeUp 0.4s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--red-dim);
    box-shadow: 0 8px 40px rgba(224,28,28,0.15), 0 0 0 1px rgba(224,28,28,0.1);
  }

  .card:hover .card-overlay { opacity: 1; }
  .card:hover .card-img img { transform: scale(1.06); }
  .card:hover .go-arrow { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  .card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    border-top: 20px solid var(--red);
    border-left: 20px solid transparent;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover::after { opacity: 1; }

  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #181818;
    position: relative;
  }

  .card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
    display: block;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(224,28,28,0.18) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .go-arrow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0.7);
    background: rgba(224,28,28,0.9);
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    backdrop-filter: blur(4px);
  }

  .card-info {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-username {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--white);
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .platform-badge {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Discord blurple */
  .platform-badge.discord { background: #5865F2; }

  .platform-badge.guns {
    background: #1a1a1a;
    border: 1px solid #333;
  }

  .platform-badge svg { width: 13px; height: 13px; }

  .card-price {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(8,8,8,0.85);
    border: 1px solid var(--red-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--red2);
    padding: 3px 8px;
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: #1a1a1a;
    display: block;
    letter-spacing: 6px;
    margin-bottom: 16px;
  }

  .empty p { font-size: 16px; letter-spacing: 1px; }

  footer {
    border-top: 1px solid var(--border);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #333;
    letter-spacing: 1px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--red-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">929
    <div class="logo-dot"></div>
  </div>
  <div class="header-right">
    <span class="live-badge">
      <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#e01c1c"/></svg>
      
    </span>
    <span id="totalCount">0 Bulundu</span>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="">
  </div>

  <div class="filters">
    <span class="filter-label">Filtre //</span>

    <button class="filter-btn active" data-filter="all">
      <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Hepsi
    </button>

    <!-- DISCORD -->
    <button class="filter-btn" data-filter="discord">
      <svg class="filter-icon" viewBox="0 0 24 24" fill="white">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Discord
    </button>

    <!-- GUNS.LOL -->
    <button class="filter-btn" data-filter="guns">
      <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 12h4l2-4h2l1 4h3l1-2h3v4h-2l-1 2H8l-2-2H3z"/>
        <circle cx="9" cy="17" r="1.5" fill="white" stroke="none"/>
        <circle cx="16" cy="17" r="1.5" fill="white" stroke="none"/>
      </svg>
      Guns.lol
    </button>
  </div>

  <div class="stats-row">
    <span class="count-badge" id="resultCount">0</span>
    <span>sonuç gösteriliyor</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<footer>
  <span>© 2026 929</span>
</footer>

<script>
const listings = [
  { id:1,  username:"d0o",   platform:"guns", price:"$0", url:"https://guns.lol/d0o", img:"https://i.pinimg.com/736x/72/54/95/725495aff9b5df05fe40e54548a670a4.jpg" },
  { id:2,  username:"i9c",    platform:"guns",    price:"$0",  url:"https://guns.lol/i9c",    img:"https://i.pinimg.com/736x/f8/af/37/f8af37eefaee8efbd133753df453fc5e.jpg" },
  { id:3,  username:"u4u",    platform:"guns", price:"$0", url:"https://guns.lol/u4u", img:"https://i.pinimg.com/736x/56/0e/d9/560ed9e43cfba6e10ec3320b50b25a83.jpg" },
  { id:4,  username:"49n", platform:"guns",    price:"$0",  url:"https://guns.lol/49n",    img:"https://i.pinimg.com/736x/09/ea/c0/09eac04ad74ebcc362e8780b40b7ae3b.jpg" },
  { id:5,  username:"57y",   platform:"guns", price:"$0", url:"https://guns.lol/57y", img:"https://i.pinimg.com/736x/86/0d/07/860d07f2e1e10f37891640d08c035f31.jpg" },
  { id:6,  username:"6t7",     platform:"guns",    price:"$0", url:"https://guns.lol/6t7",    img:"https://i.pinimg.com/736x/0e/d9/07/0ed9079c3b52f5fbda2ed3d63a77aaf0.jpg" },
  { id:7,  username:"3m3",  platform:"guns", price:"$0",  url:"https://guns.lol/3m3", img:"https://i.pinimg.com/736x/8e/6e/ca/8e6ecab84d9012903ab03b623f096ed6.jpg" },
  { id:8,  username:"0ro",  platform:"guns",    price:"$0",  url:"https://guns.lol/0ro",    img:"https://i.pinimg.com/736x/96/d7/f2/96d7f2beaf572d61713d20315f370b2d.jpg" },
  { id:9,  username:"4be",    platform:"guns", price:"$0", url:"https://guns.lol/4be", img:"https://i.pinimg.com/736x/ef/26/71/ef2671102b52b630f6d2590b9e09678b.jpg" },
  { id:10, username:"0sv",    platform:"guns",    price:"$0",  url:"https://guns.lol/0sv",    img:"https://i.pinimg.com/736x/7c/db/42/7cdb426037a0dc6c703c290f7693d244.jpg" },
  { id:11, username:"6b9",   platform:"guns", price:"$0", url:"https://guns.lol/6b9", img:"https://i.pinimg.com/736x/e9/0f/49/e90f49ce24c8e50d29cc3044304b562f.jpg" },
  { id:12, username:"tetha",  platform:"guns",    price:"$0",  url:"https://guns.lol/tetha",    img:"https://i.pinimg.com/736x/9a/f8/9e/9af89e3291d656aeb5cf887e35a6f8f4.jpg" },
];

let currentFilter = "all";
let currentSearch = "";

const discordIcon = `<svg viewBox="0 0 24 24" fill="white">
  <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
</svg>`;

const gunsIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
  <path d="M3 12h4l2-4h2l1 4h3l1-2h3v4h-2l-1 2H8l-2-2H3z"/>
  <circle cx="9" cy="17" r="1.5" fill="white" stroke="none"/>
  <circle cx="16" cy="17" r="1.5" fill="white" stroke="none"/>
</svg>`;

function render() {
  const grid = document.getElementById("grid");
  const q = currentSearch.toLowerCase().trim();

  const filtered = listings.filter(l => {
    const matchPlatform = currentFilter === "all" || l.platform === currentFilter;
    const matchSearch   = !q || l.username.toLowerCase().includes(q);
    return matchPlatform && matchSearch;
  });

  document.getElementById("resultCount").textContent = filtered.length;
  document.getElementById("totalCount").textContent  = listings.length + " Tane bulundu";

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty">
      <span class="empty-icon">404</span>
      <p>No usernames found for "<strong>${q || currentFilter}</strong>"</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map((l, i) => {
    const isDiscord = l.platform === "discord";
    const badgeCls  = isDiscord ? "discord" : "guns";
    const icon      = isDiscord ? discordIcon : gunsIcon;

    return `<a class="card" href="${l.url}" target="_blank" rel="noopener"
               style="animation-delay:${i * 0.05}s">
      <div class="card-price">${l.price}</div>
      <div class="card-img">
        <img src="${l.img}" alt="${l.username}" loading="lazy">
        <div class="card-overlay"></div>
        <div class="go-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <line x1="5" y1="19" x2="19" y2="5"/>
            <polyline points="5 5 19 5 19 19"/>
          </svg>
        </div>
      </div>
      <div class="card-info">
        <span class="card-username">@${l.username}</span>
        <div class="platform-badge ${badgeCls}">${icon}</div>
      </div>
    </a>`;
  }).join("");
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
